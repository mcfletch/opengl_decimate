[tox]
envlist =
    lint
    typecheck
    py310
    py311
    py312
    py313
    py314
    pypy3
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so what is tested is what a
# user would receive rather than the checkout beside it.
package = sdist
extras = test
# Two runs against the *installed* package: the suite, and the worked examples
# in the docstrings. The second needs `--pyargs` because the installed copy is
# not on a path pytest would otherwise collect from.
commands =
    pytest {posargs:-q} -o testpaths=tests
    pytest -q --doctest-modules --pyargs opengl_decimate

# Lint and types are gates rather than good intentions.
[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    numpy>=1.24
    pytest
commands = mypy src/opengl_decimate

# The coverage floor is a gate too: this package is all decision procedures, and
# a branch nothing runs is a branch nobody has checked.
[testenv:coverage]
deps =
    pytest
    pytest-cov
    numpy>=1.24
commands =
    pytest -q -o testpaths=tests --cov=opengl_decimate --cov-report=term-missing --cov-fail-under=100

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = lint, typecheck, coverage, py312
    3.13 = py313
    3.14 = py314
    pypy-3.10 = pypy3
