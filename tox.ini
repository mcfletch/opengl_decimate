[tox]
# Both reductions are exercised on every interpreter. The compiled reducer and
# the NumPy one are required to produce the same contractions in the same order
# for the same mesh, so a run that only ever touches whichever one this machine
# happens to have built checks half of the contract.
envlist =
    lint
    typecheck
    oldest-numpy
    py310-{accel,fallback}
    py311-{accel,fallback}
    py312-{accel,fallback}
    py313-{accel,fallback}
    py314-{accel,fallback}
    pypy3-fallback
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles its own reducer (build isolation supplies Cython and NumPy) and what
# is tested is what a user would receive rather than the checkout beside it.
package = sdist
extras = test
setenv =
    fallback: OPENGL_DECIMATE_NO_ACCEL = 1
# A `fallback` env that quietly ran the compiled reducer would pass while
# testing nothing new, and an `accel` env whose extension failed to build would
# silently become a second copy of `fallback`. Both are asserted rather than
# assumed.
commands_pre =
    accel: python -c "from opengl_decimate import native; assert native.ACCELERATED, 'the accelerator did not build'; print('reducer: compiled')"
    fallback: python -c "from opengl_decimate import native; assert not native.ACCELERATED, 'the accelerator was not disabled'; print('reducer: NumPy')"
# Two runs against the *installed* package: the suite, and the worked examples
# in the docstrings. The second needs `--pyargs` because the installed copy is
# not on a path pytest would otherwise collect from.
commands =
    pytest {posargs:-q} -o testpaths=tests
    pytest -q --doctest-modules --pyargs opengl_decimate

# Lint and types are gates rather than good intentions.
[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    numpy>=1.24
    pytest
commands = mypy src/opengl_decimate

# `dependencies` in pyproject.toml declares numpy>=1.24, and a floor nothing
# installs is a guess rather than a promise. This is the env that finds out.
#
# Only the *runtime* NumPy is pinned. The build still uses what
# `[build-system] requires` names, which is how a user's install works too: an
# extension compiled against NumPy 2 runs on 1.x by design, and that
# arrangement is itself part of what this checks.
[testenv:oldest-numpy]
base_python = py310
deps =
    numpy==1.24.*
    pytest
commands_pre =
    python -c "import numpy; assert numpy.__version__.startswith('1.24'), 'resolved numpy ' + numpy.__version__; print('numpy: ' + numpy.__version__)"
commands =
    pytest {posargs:-q} -o testpaths=tests

# The coverage floor is a gate too: this package is all decision procedures, and
# a branch nothing runs is a branch nobody has checked.
# Coverage is measured with the accelerator *on*, which is the run that reaches
# both: the differential tests drive the NumPy reduction directly, so switching
# the accelerator off would leave the dispatch that chooses it uncovered while
# covering nothing extra.
#
# What this number is about: the Python. `_reduce_native.pyx` is compiled, and
# `coverage` cannot see a compiled line unless it was built with `linetrace` --
# which `setup.py` will do on request, and which makes the reducer so much
# slower that the suite does not finish. So it is a tool for looking at a
# question, not a gate.
#
# What holds the compiled reducer instead is `tests/test_native.py`: it is
# required to produce the same contractions in the same order as the NumPy loop,
# on meshes chosen to reach each of the decisions in it -- a locked pair, a
# border, an error budget, a quality floor, a link condition refused, a
# duplicate face refused, a queue and a log grown past their initial capacity,
# and a neighbourhood larger than the working buffers start at. An agreement
# test over the same decisions is the stronger check of the two, since a branch
# can be *taken* without being taken correctly.
[testenv:coverage]
deps =
    pytest
    pytest-cov
    numpy>=1.24
commands =
    pytest -q -o testpaths=tests --cov=opengl_decimate --cov-report=term-missing --cov-fail-under=100

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310-accel, py310-fallback, oldest-numpy
    3.11 = py311-accel, py311-fallback
    3.12 = lint, typecheck, coverage, py312-accel, py312-fallback
    3.13 = py313-accel, py313-fallback
    3.14 = py314-accel, py314-fallback
    pypy-3.10 = pypy3-fallback
