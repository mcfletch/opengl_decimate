name: tests

on:
  # This project's own develop, and pull requests. `release.yml` runs this on
  # every push to main and then decides whether the version is worth
  # publishing, so main is covered from there rather than by a `push:` trigger
  # here -- which would run the whole matrix twice per push.
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh

      # tox-gh reads the [gh] table in tox.ini and runs the envs mapped to this
      # interpreter. The 3.12 row additionally runs `lint`, `typecheck` and
      # `coverage`, so ruff, mypy and the 100% coverage floor gate a merge.
      - name: Run tox
        run: tox

  # `requires-python = ">=3.10"` is a claim about installing, not about the test
  # matrix, so it is checked where a user meets it: a plain install of the sdist.
  install:
    name: sdist installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build and install the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python -m pip install dist/*.tar.gz
      - name: Import it from somewhere that is not the checkout
        run: cd /tmp && python -c "import opengl_decimate as d; print(d.__version__)"
