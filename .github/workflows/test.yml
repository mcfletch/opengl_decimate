name: tests

on:
  # This project's own develop, and pull requests. `release.yml` runs this on
  # every push to main and then decides whether the version is worth
  # publishing, so main is covered from there rather than by a `push:` trigger
  # here -- which would run the whole matrix twice per push.
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10"]
        # Wheels are published for four platforms -- Linux, Windows, and macOS
        # on arm64 and on x86_64 -- so a pull request has to see all four. A
        # full cross-product would be eighteen more jobs for what is one C
        # compiler and one set of integer widths per platform, so each of the
        # other three gets the row that also runs lint, types and the coverage
        # floor.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh

      # tox-gh reads the [gh] table in tox.ini and runs the envs mapped to this
      # interpreter. The 3.12 row additionally runs `lint`, `typecheck` and
      # `coverage`, so ruff, mypy and the coverage floors gate a merge; the 3.10
      # row runs `oldest-numpy`, which is what holds the declared NumPy floor to
      # being a promise rather than a guess.
      - name: Run tox
        run: tox

  # `requires-python = ">=3.10"` is a claim about installing, not about the test
  # matrix, so it is checked where a user meets it: a plain install of the sdist.
  install:
    name: sdist installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build and install the sdist
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --sdist
          python -m pip install dist/*.tar.gz
      - name: Import it from somewhere that is not the checkout
        run: cd /tmp && python -c "import opengl_decimate as d; print(d.__version__)"
      # Run the suite from *inside* the unpacked sdist rather than from the
      # checkout beside it. Everything else here -- tox's `package = sdist`,
      # cibuildwheel's `test-command` -- installs the sdist but then tests the
      # checkout's `tests/`, so a file the sdist failed to carry is still on
      # disk and the omission goes unseen.
      - name: Run the suite from inside the unpacked sdist
        run: |
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -C "${RUNNER_TEMP}/unpacked" --strip-components=1 -xzf dist/*.tar.gz
          cd "${RUNNER_TEMP}/unpacked" && python -m pytest -q tests -o addopts=
