[build-system]
# Cython and NumPy are required to build the package: everything listed here is
# installed for every source build, and ``setup.py`` calls ``cythonize`` to
# produce the compiled reducer. What is optional is the *result* -- a machine
# with no C compiler still installs, and falls back to the NumPy reduction at
# import time. Nothing here is optional at runtime; ``dependencies`` below is
# the whole runtime requirement.
requires = ["setuptools>=77", "wheel", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opengl_decimate"
# Read from src/opengl_decimate/__init__.py -- see [tool.setuptools.dynamic]
# below. One definition, because .github/workflows/release.yml decides whether
# to publish by reading `__version__`, and a second copy here that drifted from
# it would mean the version checked against PyPI was not the version built.
dynamic = ["version"]
description = "Triangle mesh decimation over glTF-shaped NumPy arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "decimation", "simplification", "mesh", "LOD", "quadric", "glTF",
    "numpy", "3D", "geometry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "opengl_decimate[test]",
    "mypy",
    "ruff",
    "tox>=4.0",
    "Cython>=3.0",
]

[project.urls]
Homepage = "https://github.com/mcfletch/opengl_decimate"
Repository = "https://github.com/mcfletch/opengl_decimate"

[tool.setuptools.dynamic]
version = {attr = "opengl_decimate.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Cython source ships inside the wheel and sdist so a source install can
# rebuild the reducer rather than only fall back.
opengl_decimate = ["py.typed", "*.pyx"]

[tool.pytest.ini_options]
# ``src`` is on testpaths so that the worked examples in the module docstrings
# are run.
#
# ``importlib`` import mode is what lets doctest work against a checkout whose
# package is *also* installed non-editably: the default mode refuses to collect
# a file whose module is already imported from somewhere else.
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules --import-mode=importlib"
# `tests/shapes.py` holds the meshes the suite is written against, and is
# imported by name. The `importlib` import mode above deliberately does not put
# a test file's directory on `sys.path` -- that is what makes it safe against an
# installed copy of the package -- so the one directory that has to be there is
# named here rather than left to whichever way pytest was invoked.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "B",
    "ARG",  # unused arguments -- a parameter nothing reads is a lie in a signature
    "I",    # import order
    "UP",   # constructs superseded by the minimum Python
    "SIM",  # simplifications
    "C4",   # comprehensions
    "RUF",
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
]
ignore = [
    "E501",   # line too long: held by the formatter's line-length, above
    "E741",   # ambiguous variable name
    "RUF005", # concatenation is clearer than unpacking for short literal joins
    # Diagnostics use ``%`` formatting throughout, so that the message and the
    # values it interpolates read as two separate things. House style across the
    # stack, consistently applied.
    "UP031",
    # ``__all__`` is grouped by what each name is for, with a comment per group.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# A test that pins an error signature has to call the thing that raises, and
# `pytest.raises` is the assertion -- so its result is deliberately unused.
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "single"
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
# Without these, mypy skips the bodies of untyped functions entirely
disallow_untyped_defs = true
disallow_incomplete_defs = true
# NumPy's shipped stubs type array arithmetic as ``Any``, so ``warn_return_any``
# fires on nearly every function here that returns an array -- burying the real
# type errors it would otherwise find. Every other check stays on.
warn_return_any = false

[tool.cibuildwheel]
# Stable CPython only. A wheel per platform gives an ordinary `pip install`
# the compiled reducer without a toolchain; the NumPy fallback is correct but
# too slow to reduce a scan.
#
# Free-threaded builds (`cp313t`, `cp314t`) are not produced: `cp314-*` does not
# match `cp314t-*`, so adding them is a deliberate act rather than something
# this pattern does by accident. The contraction loop runs with the GIL
# released and touches only its own C pools and the memoryviews it was handed,
# but nothing here has yet been run on a free-threaded interpreter, so the
# claim is untested rather than made.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686"
build-frontend = "build"
# `setup.py` deliberately treats a failed accelerator build as a warning rather
# than an error, which is right for a source install on an unknown machine and
# wrong for a wheel we publish: it would ship as a silently unusable package,
# since the NumPy path cannot reduce the meshes this exists for. So the wheel is
# required to carry the extension, and to agree with the NumPy path once it has.
test-requires = "pytest numpy"
test-command = [
    'python -c "from opengl_decimate import native; assert native.ACCELERATED; print(\"reducer: compiled\")"',
    "pytest -q {project}/tests -o addopts=",
]

# uv judges whether its cached metadata for a source tree is current from
# pyproject.toml alone unless told otherwise, and this project's version lives in
# src/opengl_decimate/__init__.py.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/opengl_decimate/__init__.py" }]
